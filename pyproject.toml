[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "djimbo-autoshop"
version = "0.1.0"
description = "Telegram autoshop bot on aiogram 3 by Djimbo"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11.2,<4.0",
    "aiogram>=3.28,<4.0",
    "aiofiles>=25.1,<26.0",
    "aiohttp>=3.13.5,<4.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "cachetools>=7.1,<8.0",
    "certifi>=2025.8,<2027.0",
    "colorama>=0.4,<1.0",
    "colorlog>=6.10,<7.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.2,<2.0",
    "pytz>=2026.2,<2027.0",
    "SQLAlchemy>=2.0,<3.0",
    "ujson>=5.12,<6.0",
]

[tool.setuptools.packages.find]
include = ["tgbot*"]
exclude = ["migrations*"]
